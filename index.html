<title>Phase III — Daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Bungee&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0F1A; --card:#121A2C; --card2:#1A2540; --line:#2B3B5E;
    --ink:#F6EFE6; --dim:#93A4C4; --accent:#FF7A2F; --accent-soft:#2A1C18;
    --amber:#5BC0EB;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);}
  body{font-family:'Barlow',-apple-system,system-ui,sans-serif; font-size:16px; line-height:1.45;
       padding-bottom:calc(84px + env(safe-area-inset-bottom));}
  header{position:sticky; top:0; z-index:50;
         background:linear-gradient(180deg, #101728 0%, var(--bg) 100%);
         padding:calc(10px + env(safe-area-inset-top)) 14px 0; border-bottom:1px solid var(--line);}
  .brand{display:flex; flex-direction:column; gap:2px; max-width:86px;}
  .brand h1{font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:11px;
            letter-spacing:.09em; text-transform:uppercase; margin:0; line-height:1.18; color:var(--dim);}
  .brand h1 em{font-style:normal; color:var(--dim);}
  .brand h1 span{color:var(--accent);}
  .brand h1 span{color:var(--accent);}
  .brand .sub{font-size:9px; color:var(--dim); letter-spacing:.12em; text-transform:uppercase;
              font-family:'Barlow Condensed',sans-serif;}
  .weekbar{display:grid; grid-template-columns:auto 1fr; gap:10px; align-items:center; margin:10px 0;}
  .weekbar .lbl{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:13px;
                letter-spacing:.14em; color:var(--dim); text-transform:uppercase;}
  .weeks{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .wk{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:15px;
      padding:9px 0; text-align:center; border:1px solid var(--line); border-radius:8px;
      background:var(--card); color:var(--dim); cursor:pointer;}
  .wk.active{background:var(--accent); border-color:var(--accent); color:#0B0F1A; box-shadow:0 0 12px rgba(255,122,47,.35);}
  .tabs{display:flex; gap:6px; overflow-x:auto; padding:2px 0 10px; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto; font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:16px;
       letter-spacing:.06em; text-transform:uppercase; padding:8px 14px; border-radius:999px;
       border:1px solid var(--line); background:var(--card); color:var(--dim); cursor:pointer;}
  .tab.active{color:var(--accent); border-color:var(--accent); background:var(--accent-soft); box-shadow:0 0 10px rgba(255,122,47,.22);}
  .segbar{display:flex; gap:0; margin:0 0 12px; border:1px solid var(--line); border-radius:10px;
          overflow:hidden; background:var(--card);}
  .seg{flex:1; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:15px;
       letter-spacing:.1em; text-transform:uppercase; padding:11px 0; text-align:center;
       border:none; background:transparent; color:var(--dim); cursor:pointer;
       border-right:1px solid var(--line);}
  .seg:last-child{border-right:none;}
  .seg.active{background:var(--accent); color:#0B0F1A; box-shadow:0 0 14px rgba(255,122,47,.3);}
  main{padding:14px 14px 30px; max-width:560px; margin:0 auto;}
  .dayhead{display:flex; align-items:center; justify-content:space-between; margin:2px 0 4px;}
  .dayhead h2{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:26px;
              letter-spacing:.04em; text-transform:uppercase; margin:0;}
  .chip{font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:13px; letter-spacing:.08em;
        text-transform:uppercase; color:var(--accent); border:1px solid var(--accent);
        border-radius:6px; padding:3px 8px; background:var(--accent-soft);}
  .flow{font-size:12.5px; color:var(--dim); margin:0 0 12px;}
  .flow b{color:var(--ink); font-weight:600;}
  .blockhead{font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:13px;
             letter-spacing:.16em; text-transform:uppercase; color:var(--dim);
             margin:18px 2px 8px; display:flex; align-items:center; gap:10px;}
  .blockhead::after{content:""; flex:1; height:1px;
             background:linear-gradient(90deg, var(--accent), var(--line) 45%); opacity:.55;}
  .ex{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line);
      border-radius:12px; padding:12px 12px 12px 10px; margin-bottom:8px; cursor:pointer;
      box-shadow:none;}
  .ex:active{background:var(--card2);}
  .badge{flex:0 0 auto; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:15px;
         color:var(--accent); width:36px; text-align:center;}
  .ex .body{flex:1; min-width:0;}
  .ex .nm{font-weight:600; font-size:15.5px;}
  .ex .rx{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:22px;
          margin:2px 0 1px; color:var(--accent);}
  .ex .cue{font-size:12.5px; color:var(--dim);}
  .tick{flex:0 0 auto; width:26px; height:26px; border-radius:50%; border:1.5px solid var(--line);
        display:flex; align-items:center; justify-content:center; color:transparent; font-size:14px;}
  .ex.done{opacity:.45; border-color:var(--accent-soft);}
  .ex.done .tick{background:var(--accent); border-color:var(--accent); color:#0B0F1A;}
  .clearrow{display:flex; justify-content:flex-end; margin:14px 2px 4px; font-size:13px;}
  .clearrow a{color:var(--accent); text-decoration:none;}
  .note{font-size:13px; color:var(--dim); background:var(--card); border:1px solid var(--line);
        border-radius:12px; padding:12px 14px; margin:12px 0;}
  .note b{color:var(--ink);}
  .ph{border:1px dashed var(--line); border-radius:12px; padding:28px 16px; text-align:center;
      background:var(--card); margin:8px 0;}
  .ph h3{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:19px;
         letter-spacing:.08em; text-transform:uppercase; margin:0 0 6px;}
  .ph p{color:var(--dim); font-size:13.5px; margin:0;}
  .info h3{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:17px;
           letter-spacing:.1em; text-transform:uppercase; margin:20px 0 6px; color:var(--accent);}
  .info p, .info li{font-size:14.5px;}
  .info .d{color:var(--dim);}
  .info ul{margin:4px 0 0; padding-left:18px;}
  .rest{padding:40px 10px; text-align:center;}
  .rest h2{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:28px;
           letter-spacing:.06em; text-transform:uppercase;}
  .rest p{color:var(--dim);}
  .bottombar{position:fixed; left:0; right:0; bottom:0; z-index:60; background:var(--card);
             border-top:1px solid var(--line); display:flex; align-items:center; gap:14px;
             padding:10px 14px calc(10px + env(safe-area-inset-bottom));}
  .prog{flex:1; min-width:0;}
  .prog .lab{font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:13px;
             letter-spacing:.1em; text-transform:uppercase; color:var(--dim); margin-bottom:5px;}
  .prog .lab b{color:var(--ink);}
  .bar{height:6px; border-radius:3px; background:var(--card2); overflow:hidden;}
  .bar i{display:block; height:100%; width:0%; background:linear-gradient(90deg,#5BC0EB,#FF7A2F); border-radius:3px; box-shadow:0 0 8px rgba(255,122,47,.6);}
  .timerbtn{flex:0 0 auto; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:17px;
            letter-spacing:.06em; text-transform:uppercase; color:#0B0F1A; background:var(--accent); box-shadow:0 0 14px rgba(255,122,47,.35);
            border:none; border-radius:999px; padding:12px 20px; min-width:118px; cursor:pointer;}
  .timerbtn.running{background:var(--card2); color:var(--accent); border:1px solid var(--accent);}
  .timerbtn.donef{background:#FF7A2F; color:#0B0F1A;}

  /* spine motifs */
  .spinemark{position:absolute; right:10px; top:calc(6px + env(safe-area-inset-top));
             opacity:.16; pointer-events:none;}
  .brandwrap{position:relative; display:grid; grid-template-columns:auto 1fr auto; align-items:center;
             gap:8px; padding:9px 0 8px;
             background:radial-gradient(ellipse at 50% 50%, rgba(255,122,47,.05) 0%, rgba(255,122,47,0) 70%);}
  .brandwrap::before,.brandwrap::after{content:""; position:absolute; left:-14px; right:-14px; height:1px;
             background:linear-gradient(90deg, transparent, #5BC0EB 8%, #FF7A2F 45%, #FF5C7A 80%, transparent);
             opacity:.55; box-shadow:0 0 6px rgba(255,122,47,.5);}
  .brandwrap::before{top:0;} .brandwrap::after{bottom:0;}
  .blockhead .vert{flex:0 0 auto; opacity:.75;}
  .heroband{display:flex; align-items:center; gap:12px;
            background:linear-gradient(90deg, var(--accent-soft), var(--card) 65%);
            border:1px solid var(--line); border-left:3px solid var(--accent);
            border-radius:12px; padding:12px 14px; margin:0 0 12px;}
  .heroband .txt{flex:1; min-width:0;}
  .heroband .lbl{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:11.5px;
                 letter-spacing:.16em; text-transform:uppercase; color:var(--accent); margin-bottom:2px;}
  .heroband .cue{font-size:13px; color:var(--ink); line-height:1.35;}
  .segwatch{display:flex; align-items:flex-start; gap:10px; background:var(--accent-soft);
            border:1px solid var(--line); border-radius:12px; padding:11px 13px; margin:14px 0 4px;}
  .segwatch .t{font-size:12.5px; color:var(--ink);}
  .segwatch .t b{color:var(--accent);}
  .divider{display:flex; align-items:center; justify-content:center; margin:22px 0 6px; opacity:.3;}


  /* evolution performance training banner */
  .epbanner{position:relative; text-align:center; padding:2px 4px; margin:0;}
  .epbanner .ep{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:16px;
                letter-spacing:.13em; text-transform:uppercase; color:var(--accent); margin:0;
                line-height:1.04;}
  .epbanner .by{font-family:'Barlow',sans-serif; font-weight:500; font-size:8.5px;
                letter-spacing:.2em; text-transform:uppercase; color:var(--dim); margin-top:6px;}

  @keyframes epglow{
    0%,100%{text-shadow:0 1px 0 #0B0F1A, 0 0 8px rgba(255,122,47,.35);}
    50%{text-shadow:0 1px 0 #0B0F1A, 0 0 13px rgba(255,122,47,.6);}
  }
  @media (prefers-reduced-motion: reduce){ .epbanner .ep{animation:none;} }


  /* ===== retro CRT layer ===== */
  body::before{content:""; position:fixed; inset:0; z-index:200; pointer-events:none;
    background:repeating-linear-gradient(180deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px,
               rgba(0,0,0,.26) 3px, rgba(0,0,0,.26) 4px);
    mix-blend-mode:multiply; opacity:.55;}
  body::after{content:""; position:fixed; inset:0; z-index:201; pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 52%, rgba(0,0,0,.55) 100%);}
  @keyframes flicker{0%,96%,100%{opacity:1;}97%{opacity:.92;}98%{opacity:.98;}99%{opacity:.9;}}
  header{animation:flicker 7s steps(1) infinite;}
  /* chunky retro type */
  .brand h1{font-family:'Bungee',sans-serif !important; font-size:9.5px !important;
            letter-spacing:.01em !important; line-height:1.42 !important; color:#9FB4D6 !important;}
  .epbanner .ep{font-family:'Bungee',sans-serif !important; font-size:14.5px !important;
                letter-spacing:.02em !important; line-height:1.24 !important;
                color:#FFB27A !important;
                text-shadow:0 1px 0 #0B0F1A, 0 0 10px rgba(255,122,47,.45) !important;
                animation:epglow 4.2s ease-in-out infinite;}
  .epbanner .by{font-family:'VT323',monospace !important; font-size:14px !important;
                letter-spacing:.18em !important; color:var(--amber) !important;
                text-shadow:0 0 6px rgba(91,192,235,.7);}
  .ex .rx{font-family:'VT323',monospace !important; font-size:29px !important;
          letter-spacing:.02em !important; line-height:1;}
  .prog .lab{font-family:'VT323',monospace !important; font-size:17px !important; letter-spacing:.1em !important;}
  .timerbtn{font-family:'VT323',monospace !important; font-size:22px !important; letter-spacing:.08em !important;}
  .wk{font-family:'VT323',monospace !important; font-size:20px !important;}
  .railtxt,.footspine .ft{font-family:'Bungee',sans-serif !important; letter-spacing:.14em !important;}
  /* hard-edged retro chrome */
  .ex,.wk,.tab,details,.note,.heroband,.segwatch,.ph,.segbar{border-radius:3px !important;}
  .tick{border-radius:2px !important;}
  .timerbtn{border-radius:3px !important;}
  .bar,.bar i{border-radius:0 !important;}
  .ex{border-left:3px solid var(--line);}
  .ex.done{border-left-color:var(--accent);}
  .badge{font-family:'VT323',monospace !important; font-size:19px !important; color:var(--amber);}
  .blockhead{color:var(--amber);}
  .blockhead::after{background:linear-gradient(90deg, var(--amber), var(--line) 45%) !important;}
  .heroband .lbl{color:var(--amber);}
  .chip{border-radius:2px !important; font-family:'VT323',monospace; font-size:15px;}

  .blocktip{font-family:'VT323',monospace; font-size:15.5px; line-height:1.25; color:var(--amber);
            background:var(--card); border-left:3px solid var(--amber); border-radius:3px;
            padding:7px 10px; margin:-2px 0 9px; opacity:.92;}
  .ex .tip{font-family:'VT323',monospace; font-size:15px; line-height:1.2; color:var(--accent);
           margin-top:4px; opacity:.85;}

  .phaselbl{font-family:'VT323',monospace; font-size:16px; letter-spacing:.08em; color:var(--dim);
            margin:-4px 0 8px; text-transform:uppercase;}
  .phaselbl b{color:var(--accent); font-weight:400;}
  .chips{display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end;}
  .daynote{font-family:'VT323',monospace; font-size:16px; line-height:1.25; color:var(--ink);
           background:var(--card); border:1px solid var(--line); border-radius:3px; padding:8px 10px; margin:0 0 6px;}
  /* side spine rails */
  .rail{position:fixed; top:0; bottom:0; width:78px; display:none; align-items:center;
        justify-content:center; pointer-events:none; z-index:5;}
  .rail.l{left:0;} .rail.r{right:0;}
  .railin{display:flex; flex-direction:column; align-items:center; gap:14px;
          filter:drop-shadow(0 0 3px rgba(255,122,47,.45));
          animation:figglow 3.4s ease-in-out infinite;}
  .railtxt{font-weight:700; font-size:12px; letter-spacing:.22em; text-transform:uppercase;
           color:#FFB27A; writing-mode:vertical-rl; text-orientation:mixed;
           text-shadow:0 1px 0 #0B0F1A, 0 0 9px rgba(255,122,47,.4);}
  .rail.l .railtxt{transform:rotate(180deg);}
  .rail.r .railin{transform:scaleX(-1);}
  .rail.r .railtxt{transform:scaleX(-1);}
  @media (min-width:820px){ .rail{display:flex;} }
  /* mobile footer spine */
  .footspine{display:flex; align-items:center; justify-content:center; gap:16px;
             margin:26px 0 6px; opacity:.9;
             filter:drop-shadow(0 0 3px rgba(255,122,47,.4));
             animation:figglow 3.4s ease-in-out infinite;}
  .footspine .ft{font-weight:700; font-size:13px; letter-spacing:.2em; text-transform:uppercase;
                 color:#FFB27A; text-shadow:0 1px 0 #0B0F1A, 0 0 9px rgba(255,122,47,.4);}
  @media (min-width:820px){ .footspine{display:none;} }
  /* runner hero */
  .runner{pointer-events:none; line-height:0;}
  .markrow{display:flex; align-items:center; gap:9px;}
  .markrow svg{display:block;}
  .runner svg{display:block;}
  @keyframes figglow{
    0%,100%{filter:drop-shadow(0 0 2px rgba(255,122,47,.5));}
    50%{filter:drop-shadow(0 0 5px rgba(255,122,47,.75));}
  }
  .runner svg{animation:figglow 3.4s ease-in-out infinite;}
  /* segment + card animations */
  @keyframes segIn{from{opacity:0; transform:translateY(8px);}to{opacity:1; transform:translateY(0);}}
  .animseg > *{animation:segIn 260ms cubic-bezier(.22,.9,.3,1) both;}
  .animseg > *:nth-child(1){animation-delay:0ms;}
  .animseg > *:nth-child(2){animation-delay:26ms;}
  .animseg > *:nth-child(3){animation-delay:52ms;}
  .animseg > *:nth-child(4){animation-delay:78ms;}
  .animseg > *:nth-child(5){animation-delay:104ms;}
  .animseg > *:nth-child(6){animation-delay:130ms;}
  .animseg > *:nth-child(7){animation-delay:156ms;}
  .animseg > *:nth-child(8){animation-delay:182ms;}
  .animseg > *:nth-child(n+9){animation-delay:200ms;}
  @keyframes tickPop{0%{transform:scale(1);}40%{transform:scale(1.35);}100%{transform:scale(1);}}
  @keyframes cardFlash{0%{box-shadow:0 0 0 0 rgba(255,122,47,.55);}100%{box-shadow:0 0 0 14px rgba(255,122,47,0);}}
  .ex.justdone{animation:cardFlash 480ms ease-out;}
  .ex.justdone .tick{animation:tickPop 340ms cubic-bezier(.3,1.4,.5,1);}
  @media (prefers-reduced-motion: reduce){
    .runner svg,.animseg > *,.ex.justdone,.ex.justdone .tick{animation:none !important;}
  }
  @media (prefers-reduced-motion: no-preference){
    .ex,.wk,.tab,.seg,.bar i{transition:background .12s ease,opacity .12s ease,color .12s ease,width .25s ease;}
  }
</style>
</head>
<body>
<header>
  <div class="brandwrap"><div class="brand">
    <h1 class="ttl">Spine-Safe<br>Strength Rehab<br><span>Phase III</span></h1>
    <div class="sub" id="todayLabel"></div>
  </div>
  <div class="epbanner">
    <div class="rule t"></div>
    <div class="ep">Evolution<br>Performance Training</div>
    <div class="by">by Luke Abercrombie</div>
    <div class="rule b"></div>
  </div>
  <div class="runner" id="runner"></div></div>
  <div class="weekbar">
    <div class="lbl">Week</div>
    <div class="weeks" id="weeks"></div>
  </div>
  <div class="phaselbl" id="phaseLbl"></div>
  <div class="tabs" id="tabs"></div>
</header>
<div class="rail l"><div class="railin" id="railL"></div></div>
<div class="rail r"><div class="railin" id="railR"></div></div>
<main id="main"></main>
<div class="bottombar">
  <div class="prog">
    <div class="lab" id="progLab">—</div>
    <div class="bar"><i id="progFill"></i></div>
  </div>
  <button class="timerbtn" id="timerBtn" onclick="timerTap()">Rest 90s</button>

function dl(rx){
  let m=rx.match(/^(\d+) (×|rd:)(.*)$/);
  if(m){ const n=Math.max(1,Math.round(parseInt(m[1])/2)); return n+" "+m[2]+m[3]; }
  m=rx.match(/^(\d+) rounds?$/);
  if(m){ const n=Math.max(1,Math.round(parseInt(m[1])/2)); return n+(n===1?" round":" rounds"); }
  return rx;
}

  const data=segData();
  let tot=0,dn=0;
  data.forEach(b=>{
    const bt=BLOCK_TIPS[b.h];
    html+=`<div class="blockhead">${SPINE_VERT}${b.h}</div>`+(bt?`<div class="blocktip">${bt}</div>`:"")+b.items.map(exCard).join("");
    tot+=b.items.length; dn+=b.items.filter(i=>done[day+"-"+seg+"-"+i.id]).length;
  });
  if(seg==="prehab") html+=`<div class="note">Run as circuits, not straight sets — the circuit is the rest. About 19 minutes.</div>`;
  if(seg==="rehab")  html+=`<div class="note">About 20 minutes. Active work first, then nerve work, then lengthen, then decompress — qi gong is the last thing you do.</div>`;
  html+=`<div class="segwatch">${SPINE_DISC}<div class="t"><b>Watch for:</b> pain that stays local and fades in 24h is the back adapting. Anything travelling into the glute or down the leg — stop, regress, tell your PT.</div></div>`;
  html+=`<div class="clearrow"><a href="#" onclick="clearSeg(event)">Clear ${SEGNAMES[seg]} checks</a></div>`;
  html+=`<div class="footspine">${SPINE_ANAT.replace('width="54" height="248"','width="26" height="120"')}<div class="ft">Pain Free Movement</div></div>`;
  main.innerHTML=`<div class="animseg">`+html+`</div>`;
  updateBar(dn,tot,d.label+" · "+SEGNAMES[seg]);
}
function infoHTML(){
  return `<div class="info"><div style="text-align:center;padding:6px 0 2px">${SPINE_ICON(28,68,.9)}</div>
  <h3>The 7-week shape</h3><ul>
   <li><span class="d">Wk 1–2 · Learn.</span> Same reps both weeks — add load in week 2, not volume. Lots of new patterns this phase.</li>
   <li><span class="d">Wk 3–4 · Build.</span> Reps hold, load climbs. Take your PT check and thigh/calf measurements at the end of week 4.</li>
   <li><span class="d">Wk 5–6 · Peak.</span> Highest loads and bench ranges of the phase.</li>
   <li><span class="d">Wk 7 · Deload.</span> <b>Mandatory.</b> Half the sets, ~20% lighter, every rep fast and crisp.</li></ul>
  <h3>High–low split</h3><p>HIGH days (Mon, Wed, Fri) carry the heavy and explosive work. LOW days (Tue, Thu) are lighter loads, skill and technique. Thursday is low on load but high on rotation — Friday-morning stiffness is the check on that stack.</p>
  <h3>Autoregulation</h3><p>Load ranges are guardrails, not targets. <b>The rule is reps-in-reserve.</b> Moving well, take the top of the range. Feeling flat, take the bottom — no guilt. Bar speed ends the set. If the back talks, that overrides everything.</p>
  <p class="d">The bench ranges are placeholders — reset them from where Phase 2 actually finished.</p>
  <h3>Right-leg rule</h3><p>Right leg first on every single-leg set, and the left only matches what the right completes — never more.</p>
  <h3>Needs your PT's yes before Week 1</h3><ul>
   <li>Barbell power clean and snatch (Fri)</li>
   <li>Single-leg drop-to-stick (Wed) and single-leg box jumps (Fri)</li>
   <li>A- and B-skips (Wed)</li>
   <li>Heavy bag (Tue, Thu)</li>
   <li>Jefferson curl (Mon, Thu)</li></ul>
  <h3>Time governor</h3><p>Lifting stops at 70 minutes on most days; Friday runs longer. Blocks are ordered by priority — the last blocks are the trim on a tight morning.</p>
  <h3>Back-off signals</h3><p class="d">Bench top sets stalling, morning back stiffness trending up, or joints aching from volume — cut the tail blocks for a week.</p>
  <h3>Still parked</h3><p class="d">Land sprints, depth jumps, landing from height, broad jumps, barbell back squats and conventional deadlifts, wrestler bridges, sit-ups.</p>
  <h3>Guardrails</h3><p>Neutral spine every rep. Quiet landings. A mild local ache that settles in 24h is fine — anything radiating into the glute or leg means stop, regress, and tell your PT. No heavy lifting within about an hour of waking.</p></div>`;
}
window.setWeek=i=>{week=i;saveWeek();renderWeeks();render();};
window.setDay=id=>{day=id; const d=DAYS[id]; seg=d?(d.segs.includes("lift")?"lift":d.segs[0]):"lift"; renderTabs();render();};
window.setSeg=s=>{seg=s;render();};
window.toggle=id=>{const k=day+"-"+seg+"-"+id; const adding=!done[k];
  adding?done[k]=1:delete done[k]; saveDone(); render();
  if(adding){const el=document.querySelector('[data-ex="'+id+'"]');
    if(el){el.classList.add('justdone'); setTimeout(()=>el.classList.remove('justdone'),520);}}};
window.clearSeg=e=>{e.preventDefault(); Object.keys(done).forEach(k=>{if(k.startsWith(day+"-"+seg+"-"))delete done[k];}); saveDone(); render();};

/* ---------- rest timer ---------- */
let timerId=null,timerEnd=0,actx=null;
function beep(){try{ if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
  [0,.22].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain();o.type="square";o.frequency.value=880;
   g.gain.setValueAtTime(.08,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+t+.15);
   o.connect(g);g.connect(actx.destination);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.16);});}catch(e){}}
window.timerTap=()=>{const btn=$("timerBtn");
  if(timerId){clearInterval(timerId);timerId=null;btn.textContent="Rest 90s";btn.className="timerbtn";return;}
  try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}
  timerEnd=Date.now()+90000; btn.className="timerbtn running";
  timerId=setInterval(()=>{const r=timerEnd-Date.now();
    if(r<=0){clearInterval(timerId);timerId=null;btn.textContent="GO";btn.className="timerbtn donef";beep();
      setTimeout(()=>{if(!timerId){btn.textContent="Rest 90s";btn.className="timerbtn";}},2500);return;}
    const s=Math.ceil(r/1000);btn.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");},200);};

})();
